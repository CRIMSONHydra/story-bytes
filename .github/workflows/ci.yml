name: CI/CD

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # A real pgvector Postgres so migrations are validated in CI and integration tests have a DB.
    # (Unit tests mock the pool and pass without it — see the "dead DB" hermeticity audit — but the
    # migration step below exercises the real schema.)
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Unit tests mock all Gemini/network/DB calls; these values just satisfy config validation and
      # keep the environment realistic. No real external calls are made in the test job.
      GEMINI_API_KEY: ci-dummy-key
      GOOGLE_SEARCH_API_KEY: ci-dummy
      GOOGLE_CX: ci-dummy
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Verify database migrations apply
        working-directory: backend
        run: pnpm migrate:up

      - name: Backend tests
        run: pnpm test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python dependencies
        run: uv pip install --system -r ingestion/requirements-dev.txt

      - name: Python tests
        run: python -m pytest ingestion/tests/ -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/story-bytes:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/story-bytes:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/story-bytes:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
